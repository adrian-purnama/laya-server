services:
  laya:
    build: .
    ports:
      - "11436:${PORT:-8000}"
    environment:
      # Compose auto-loads a file named .env in this same folder and fills
      # these in from it. Anything missing from .env falls back to the
      # value after the ":-".
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8000}
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - /hdd1/model-files/laya:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]